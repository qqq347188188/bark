name: Build TrollStore IPA (Zero-Cert / Jailbreak)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Cache Pods
        uses: actions/cache@v5
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Pods
        run: pod install

      # 注入新增源文件 + 为扩展链接 Photos.framework（无需本地 Xcode）
      - name: Install gems
        run: bundle install

      - name: Patch Xcode project
        run: bundle exec ruby scripts/setup_xcodeproj.rb

      # 注入 GitHub Run Id（原版由 fastlane 写入 Info.plist；TrollStore 构建需手动注入，
      # 否则设置页“Github Run Id”为空，且无法跳转到对应构建记录）
      - name: Inject GitHub Run Id
        run: /usr/libexec/PlistBuddy -c "Set :'GitHub Run Id' '${{ github.run_id }}'" Bark/Info.plist

      # 关闭签名，仅编译出未签名的 .app
      - name: Build (no code signing)
        run: |
          xcodebuild -workspace Bark.xcworkspace -scheme Bark \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            build

      # TrollStore 需要 ad-hoc 签名并嵌入 entitlements（含相册/推送权限）
      - name: Ad-hoc sign with entitlements (TrollStore ready)
        run: |
          APP="build/Build/Products/Release-iphoneos/Bark.app"
          codesign --force --deep --sign - --entitlements Bark/Bark.entitlements "$APP"
          codesign --force --deep --sign - --entitlements NotificationServiceExtension/NotificationServiceExtension.entitlements "$APP/PlugIns/NotificationServiceExtension.appex"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/Bark.app" Payload/
          zip -r Bark-TrollStore.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: Bark-TrollStore
          path: Bark-TrollStore.ipa
